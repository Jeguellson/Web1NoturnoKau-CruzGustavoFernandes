<!DOCTYPE html>
<!--TODO: checkbox de continual logado-->
<html xmlns="http://www.w3.org/1999/html">

<head>
  <meta charset="UTF-8">
  <title>Faça Login em Sua Conta</title>
  <link rel="stylesheet" href="..\css\textField.css" />
  <link rel="stylesheet" href="../css/principal.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

</head>

<body class="body-cadastro">

  <header class="cabecalhoLogin">


    <h1 id="tituloLogin">Utilize sua conta de apoiador!</h1>

    <nav class="login-nav">
      <h2>Seja um pata-amiga!</h2>
    </nav>

  </header>
  <div class="corpoCadastro">

    <div class="orelha-direita"></div>
    <div class="orelha-esquerda"></div>
    <div class="catbox">

      <div class="cat-face">
        <div class="loginInfo">

          <div class="status-box">
            <input id="statusIcon" type="checkbox" disabled>
            <label id="statusLabel">Inativo</label>
          </div>

          <!-- <input type="text" id="inputNome" placeholder="Nome"> -->
          <div class="container">
            <div class="textfield" id="textfield-containerUsuario">
              <input type="text" id="textfield-inputUsuario" placeholder=" ">
              <label for="textfield-inputUsuario">Nome</label>

              <img class="material-symbols-outined icon-error" src="../img/redIcon.png" alt="Error ao preencher campo">

              <img class="material-symbols-outined icon-success" src="../img/sucessIcon.png"
                alt="Sucesso ao preencher campo">

            </div>
            <div class="textfield" id="textfield-containerUsuario">
              <input type="text" id="textfield-inputUsuario" placeholder=" ">
              <label for="textfield-inputUsuario">Nome</label>

              <img class="material-symbols-outined icon-error" src="../img/redIcon.png" alt="Error ao preencher campo">

              <img class="material-symbols-outined icon-success" src="../img/sucessIcon.png"
                alt="Sucesso ao preencher campo">

            </div>
            <div class="textfield" id="textfield-containerUsuario">
              <input type="text" id="textfield-inputUsuario" placeholder=" ">
              <label for="textfield-inputUsuario">Nome</label>

              <img class="material-symbols-outined icon-error" src="../img/redIcon.png" alt="Error ao preencher campo">

              <img class="material-symbols-outined icon-success" src="../img/sucessIcon.png"
                alt="Sucesso ao preencher campo">

            </div>

            <!-- <input type="text" id="inputSenha" placeholder="Senha"> -->
            <div class="textfield" id="textfield-containerSenha">
              <input type="text" id="textfield-input" placeholder=" ">
              <label for="textfield-input">Senha</label>

              <img class="material-symbols-outined icon-error" src="../img/redIcon.png" alt="Error ao preencher campo">

              <img class="material-symbols-outined icon-success" src="../img/sucessIcon.png"
                alt="Sucesso ao preencher campo">

            </div>


            <div class="row">
              <div class="opcao">
                <input type="radio" id="lembrarMe">
                <label for="lembrarMe"></label>
              </div>
              <label class="lembrarMe">Lembrar-me</label>
            </div>

            <div class="acoes-botoes">
              <button type="submit" class="botao login"
                onclick="cadastrar(document.getElementById('textfield-inputUsuario').value, document.getElementById('textfield-input').value)">

                Entrar
              </button>


            </div>

          </div>

        </div>

      </div>

    </div>

  </div>



  <div class="bg-patinhas"></div>
  <footer>
    Copyright de Adopt Cat - Fundação sem Fins Lucrativos
  </footer>

  <script src="../js/backend_cadastro.js"></script>
  
</body>

</html>
